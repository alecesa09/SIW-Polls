spring.application.name=siwPolls
#==================================
# = Datasource
#==================================
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=error

logging.level.it.uniroma3.siw.service=info
logging.level.it.uniroma3.siw.config=error

spring.datasource.url=${DB_URL:jdbc:p6spy:postgresql://localhost:5432/Polls}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Alessio09!}
spring.datasource.driver-class-name=${DB_DRIVER:com.p6spy.engine.spy.P6SpyDriver}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


server.forward-headers-strategy=framework 
server.servlet.session.cookie.secure=true
# rendere secure pure i cookie di jsessionid

#==================================
# Web server
#==================================
server.port=8080
#==================================
# = Thymeleaf configurations
#==================================
spring.thymeleaf.check-template-location=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.encoding=UTF-8
#==================================
# = Messages configuration 
#==================================
 spring.messages.basename=messages/messages 
 spring.messages.encoding=ISO-8859-1
spring.jpa.properties.hibernate.format_sql=true
 spring.jpa.properties.hibernate.highlight_sql=true
 spring.servlet.multipart.max-file-size=5MB
# Dimensione massima consentita per l'intera richiesta (file + dati JSON)
spring.servlet.multipart.max-request-size=10MB
#==================================
# = Variabili di configurazione
#==================================

#app.frontend.url=http://localhost:5173
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.upload.dir=${APP_UPLOAD_DIR:../uploads_immagini/}